[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    live: marks tests as live external API calls (deselect with '-m "not live"')
    slow: marks tests as slow real-model execution (e.g. local sentence-transformers inference)
